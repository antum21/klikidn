services:
    app:
        build: .
        container_name: klikidn
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www/html
            - vendor_data:/var/www/html/vendor  # ← tambahkan ini
        depends_on:
            - db
        environment:
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: klikidn
            DB_USERNAME: root
            DB_PASSWORD: ""
        restart: always
        

    db:
        image: mysql:8
        container_name: klikidn_db
        restart: always
        environment:
            MYSQL_DATABASE: klikidn
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_ROOT_PASSWORD: ""
        # ports tidak perlu dipublish karena app container bisa akses langsung via network service 'db'
        # ports:
        #     - "3306:3306"

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: klikidn_phpmyadmin
        restart: always
        ports:
            - "8081:80"
        environment:
            PMA_HOST: db
            PMA_USER: root
            PMA_PASSWORD: ""

volumes:
    vendor_data:
